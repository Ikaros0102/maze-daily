<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="fireflyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0b5" stop-opacity="1" />
      <stop offset="45%" stop-color="#00f0b5" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00f0b5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <!-- Deep Obsidian Background -->
  <rect width="64" height="64" rx="14" fill="#080c14" />
  <!-- Outer Maze Frame -->
  <rect x="7" y="7" width="50" height="50" rx="8" stroke="url(#wallGrad)" stroke-width="3.5" stroke-opacity="0.85" />
  <!-- Maze Corridors -->
  <path
    d="M7 22 H24 V15 M40 7 V22 H49 M17 34 H34 V22 M24 34 V49 H38 M47 34 V49 M17 45 V57"
    stroke="#3b5278"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Glowing Firefly Player -->
  <circle cx="32" cy="34" r="14" fill="url(#fireflyGlow)" />
  <circle cx="32" cy="34" r="5" fill="#00f0b5" />
  <circle cx="32" cy="34" r="2.2" fill="#ffffff" />
</svg>
